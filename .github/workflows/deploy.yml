name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy on app-vm
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh deploy@"$HOST" 'cd /var/www/guestbook && git fetch origin main && git reset --hard origin/main && bash scripts/deploy.sh'

      - name: Health check
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "http://$HOST/health" || true)
            if [ "$body" = "OK" ]; then echo "Healthy"; exit 0; fi
            echo "Attempt $i failed, retrying..."; sleep 5
          done
          echo "Health check failed"; exit 1
